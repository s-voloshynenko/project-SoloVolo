<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your Energy: exercises by body part, muscles and equipment, with daily motivation."
    />
    <title>Your Energy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/sections/hero.html" />

      <section class="exercises">
        <div class="container exercises-container">
          <div class="exercises-head">
            <h2 class="exercises-title">Exercises</h2>
            <ul class="filters" data-filters>
              <li>
                <button class="filter-btn is-active" type="button" data-filter="Muscles" aria-pressed="true">
                  Muscles
                </button>
              </li>
              <li>
                <button class="filter-btn" type="button" data-filter="Body parts" aria-pressed="false">
                  Body parts
                </button>
              </li>
              <li>
                <button class="filter-btn" type="button" data-filter="Equipment" aria-pressed="false">
                  Equipment
                </button>
              </li>
            </ul>
          </div>

          <div class="exercises-body">
            <div class="exercises-content">
              <ul class="categories" data-categories></ul>
              <p class="exercises-empty" data-categories-empty hidden>
                Nothing found for this filter. Try another one.
              </p>
              <ul class="pagination exercises-pagination" data-categories-pagination></ul>
            </div>

            <load src="./partials/daily.html" />
          </div>
        </div>
      </section>
    </main>

    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
