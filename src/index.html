<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your Energy: exercises by body part, muscles and equipment, with daily motivation."
    />
    <title>Your Energy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/sections/hero.html" />

      <section class="exercises">
        <div class="container exercises-container">
          <div class="exercises-head">
            <div class="exercises-heading">
              <h2 class="exercises-title">
                Exercises<span class="exercises-slash" data-category-slash hidden> /</span>
              </h2>
              <span class="exercises-category" data-category-label hidden></span>
            </div>

            <div class="exercises-tools">
              <form class="search-field exercises-search" data-search-form hidden>
                <label class="visually-hidden" for="exercise-search">Search exercises</label>
                <input
                  class="search-input"
                  id="exercise-search"
                  type="search"
                  name="keyword"
                  placeholder="Search"
                  autocomplete="off"
                />
                <div class="search-actions">
                  <button class="search-btn search-clear" type="button" aria-label="Clear search" data-search-clear hidden>
                    <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-close"></use></svg>
                  </button>
                  <button class="search-btn" type="submit" aria-label="Search">
                    <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-search"></use></svg>
                  </button>
                </div>
              </form>

              <ul class="filters" data-filters>
                <li>
                  <button class="filter-btn is-active" type="button" data-filter="Muscles" aria-pressed="true">
                    Muscles
                  </button>
                </li>
                <li>
                  <button class="filter-btn" type="button" data-filter="Body parts" aria-pressed="false">
                    Body parts
                  </button>
                </li>
                <li>
                  <button class="filter-btn" type="button" data-filter="Equipment" aria-pressed="false">
                    Equipment
                  </button>
                </li>
              </ul>
            </div>
          </div>

          <div class="exercises-body">
            <div class="exercises-content">
              <ul class="categories" data-categories></ul>
              <ul class="exercise-list" data-exercises hidden></ul>
              <p class="exercises-empty" data-catalog-empty hidden></p>
              <ul class="pagination exercises-pagination" data-catalog-pagination></ul>
            </div>

            <load src="./partials/daily.html" />
          </div>
        </div>
      </section>
    </main>

    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
