<div class="modal-backdrop" data-rating-backdrop>
  <div class="modal rating-modal" role="dialog" aria-modal="true" aria-labelledby="rating-modal-title">
    <button class="modal-close" type="button" aria-label="Close" data-rating-close>
      <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-close-menu"></use></svg>
    </button>

    <form class="rating-form" data-rating-form>
      <fieldset class="rating-fieldset">
        <legend class="rating-legend" id="rating-modal-title">Rating</legend>
        <div class="rating-picker">
          <span class="rating-picker-value" data-rating-value>0.0</span>
          <div class="rating-stars">
            <input class="visually-hidden" type="radio" name="rate" id="rate-5" value="5" required />
            <label class="rating-star-label" for="rate-5">
              <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-star"></use></svg>
              <span class="visually-hidden">5 stars</span>
            </label>
            <input class="visually-hidden" type="radio" name="rate" id="rate-4" value="4" required />
            <label class="rating-star-label" for="rate-4">
              <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-star"></use></svg>
              <span class="visually-hidden">4 stars</span>
            </label>
            <input class="visually-hidden" type="radio" name="rate" id="rate-3" value="3" required />
            <label class="rating-star-label" for="rate-3">
              <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-star"></use></svg>
              <span class="visually-hidden">3 stars</span>
            </label>
            <input class="visually-hidden" type="radio" name="rate" id="rate-2" value="2" required />
            <label class="rating-star-label" for="rate-2">
              <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-star"></use></svg>
              <span class="visually-hidden">2 stars</span>
            </label>
            <input class="visually-hidden" type="radio" name="rate" id="rate-1" value="1" required />
            <label class="rating-star-label" for="rate-1">
              <svg class="icon" aria-hidden="true"><use href="./images/icons.svg#icon-star"></use></svg>
              <span class="visually-hidden">1 star</span>
            </label>
          </div>
        </div>
      </fieldset>

      <label class="visually-hidden" for="rating-email">Email</label>
      <input
        class="rating-input"
        id="rating-email"
        type="email"
        name="email"
        placeholder="Email"
        autocomplete="email"
        pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
        required
      />

      <label class="visually-hidden" for="rating-review">Your comment</label>
      <textarea
        class="rating-input rating-textarea"
        id="rating-review"
        name="review"
        placeholder="Your comment"
        required
      ></textarea>

      <button class="btn btn-filled rating-submit" type="submit">Send</button>
    </form>
  </div>
</div>
