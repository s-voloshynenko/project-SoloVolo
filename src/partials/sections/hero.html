<section class="hero">
  <div class="container hero-container">
    <div class="hero-content">
      <h1 class="hero-title">
        <img class="hero-sun" src="./images/sun.svg" width="59" height="59" alt="" />
        Get <em>Body</em> in shape, Stay healthy
      </h1>
      <p class="hero-text">
        Transform your physique and embrace a healthier lifestyle with our comprehensive fitness and
        nutrition support.
      </p>
    </div>

    <img
      class="hero-thumb"
      src="./images/hero/hero-thumb.webp"
      srcset="./images/hero/hero-thumb.webp 1x, ./images/hero/hero-thumb@2x.webp 2x"
      width="168"
      height="100"
      alt="Two women balancing on one leg, feet touching"
    />

    <ul class="hero-tags">
      <li class="hero-tag">#Sport</li>
      <li class="hero-tag">#Healthy</li>
      <li class="hero-tag">#Workout</li>
      <li class="hero-tag">#Diet</li>
    </ul>

    <picture class="hero-picture">
      <source
        media="(min-width: 1440px)"
        srcset="./images/hero/hero-desktop.webp 1x, ./images/hero/hero-desktop@2x.webp 2x"
        width="1376"
        height="350"
      />
      <source
        media="(min-width: 768px)"
        srcset="./images/hero/hero-tablet.webp 1x, ./images/hero/hero-tablet@2x.webp 2x"
        width="704"
        height="550"
      />
      <img
        class="hero-img"
        src="./images/hero/hero-mobile.webp"
        srcset="./images/hero/hero-mobile.webp 1x, ./images/hero/hero-mobile@2x.webp 2x"
        width="335"
        height="460"
        alt="Two women giving each other a high five during a workout by the lake"
      />
    </picture>
  </div>
</section>
