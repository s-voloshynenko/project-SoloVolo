<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your Energy: exercises by body part, muscles and equipment, with daily motivation."
    />
    <title>Favorites | Your Energy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load src="./partials/header.html" />

    <main>
      <section class="favorites">
        <div class="container">
          <h1 class="favorites-title">Favorites</h1>

          <div class="favorites-body">
            <load src="./partials/daily.html" />

            <div class="favorites-content">
              <ul class="exercise-list favorites-list" data-favorites-list></ul>
              <p class="favorites-empty" data-favorites-empty hidden>
                It appears that you haven't added any exercises to your favorites yet. To get started, you
                can add exercises that you like to your favorites for easier access in the future.
              </p>
              <ul class="pagination favorites-pagination" data-favorites-pagination></ul>
            </div>
          </div>
        </div>
      </section>
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/exercise-modal.html" />
    <load src="./partials/rating-modal.html" />

    <script type="module" src="./favorites.js"></script>
  </body>
</html>
